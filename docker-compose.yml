services:
  publisher:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-samarkanov}/udp-sse-publisher:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: python/publisher/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "0.0.0.0:5018:5018/udp"
    volumes:
      - ./config.toml:/app/config.toml
    restart: unless-stopped
    networks:
      - digital-twin-net

  subscriber:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-samarkanov}/udp-sse-subscriber:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: python/subscriber/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "0.0.0.0:5015:5015/udp"
    volumes:
      - ./config.toml:/app/config.toml
      - ./shared_data:/app/shared_data
    restart: unless-stopped
    networks:
      - digital-twin-net

  dashboard:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-samarkanov}/udp-sse-dashboard:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: python/dashboard/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "0.0.0.0:5000:5000"
    volumes:
      - ./config.toml:/app/config.toml
      - ./shared_data:/app/shared_data
    restart: unless-stopped
    networks:
      - digital-twin-net

  #digital-twin:
  #  image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-samarkanov}/udp-sse-digital-twin:${IMAGE_TAG:-latest}
  #  build:
  #    context: .
  #    dockerfile: matlab/Dockerfile
  #  ports:
  #    - "0.0.0.0:5016:5016/udp"
  #    - "0.0.0.0:5017:5017/udp"
  #  restart: unless-stopped
  #  networks:
  #    - digital-twin-net

networks:
  digital-twin-net:
    driver: bridge
