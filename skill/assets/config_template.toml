# Project Configuration

[network]
# IP address and ports for UDP communication.
bind_address = "0.0.0.0"
target_digital_twin = "digital-twin"
target_subscriber = "subscriber"
receiver_port = 5015
sink_port = 5016
control_port = 5017
publisher_port = 5018

[simulation]
sample_time = 0.1
pacing_rate = 1
json_buffer_size = 128

[storage]
db_path = "shared_data/data.db"

[dashboard]
port = 5000
