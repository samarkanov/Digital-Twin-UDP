name: Docker Publish

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  OWNER: samrkanov

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Owner Name
        run: |
          echo "OWNER_LOWER=$(echo ${{ env.OWNER }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ github.event.release.tag_name }} \
            --pattern 'bld.zip' \
            --dir ./

      - name: Extract build context
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          unzip bld.zip
          # Ensure bld/ directory is present in the workspace root
          ls -R bld/

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/udp-sse-publisher
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/udp-sse-subscriber
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/udp-sse-dashboard
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/udp-sse-digital-twin
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Publisher
        uses: docker/build-push-action@v5
        with:
          context: .
          file: python/publisher/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/udp-sse-publisher:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Subscriber
        uses: docker/build-push-action@v5
        with:
          context: .
          file: python/subscriber/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/udp-sse-subscriber:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: python/dashboard/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/udp-sse-dashboard:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Digital Twin
        uses: docker/build-push-action@v5
        with:
          context: .
          file: matlab/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/udp-sse-digital-twin:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
